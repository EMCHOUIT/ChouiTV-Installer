plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.chouitv.installer'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.chouitv.installer'
        minSdk 26
        targetSdk 34
        // the installer has its own version: 1.0, 1.1, ... (the ChouiTV version it installs is read from latest.json)
        versionCode 3
        versionName "1.1.1"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'installer'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // the pure part (the plan, the guard, the run on a fake TV) is tested on the JVM
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
