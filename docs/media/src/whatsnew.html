<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { height: 980px; }
  .stage { height: 980px; padding: 92px 90px 0; display: grid; grid-template-columns: 930px 1fr; column-gap: 70px; }
  .col { display: flex; flex-direction: column; }
  .pillrow { margin-bottom: 34px; }
  h1 { font-size: 92px; }
  .sub { font-size: 40px; color: var(--muted); margin: 18px 0 40px; font-weight: 400; }
  .rule { height: 3px; width: 420px; background: linear-gradient(90deg, var(--gold), transparent); margin: 0 0 34px; }
  [dir=rtl] .rule { background: linear-gradient(270deg, var(--gold), transparent); }
  .card {
    display: flex; gap: 26px; align-items: center; padding: 22px 30px; margin-bottom: 22px; border-radius: 28px;
    border: 2.5px solid rgba(214, 175, 107, .85); background: linear-gradient(135deg, rgba(60, 56, 30, .55), rgba(27, 51, 37, .9));
  }
  .card .ck { width: 52px; height: 52px; flex: none; }
  .card b { display: block; font-size: 38px; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .card span { font-size: 30px; color: var(--cream); line-height: 1.3; }
  .panel {
    margin-top: 40px; height: 790px; border-radius: 40px; border: 2px solid rgba(214, 175, 107, .55);
    background: linear-gradient(160deg, rgba(20, 40, 29, .92), rgba(8, 24, 16, .95)); padding: 28px 34px; position: relative;
    display: flex; flex-direction: column; align-items: center;
  }
  .panel .tag { align-self: flex-start; }
  [dir=rtl] .panel .tag { align-self: flex-start; }
  .row { display: flex; gap: 18px; justify-content: center; width: 100%; }
  .lbl { font-size: 28px; color: var(--muted); margin: 26px 0 14px; display: flex; gap: 14px; align-items: center; }
  .lbl em { font-style: normal; color: var(--gold); font-weight: 700; font-size: 34px; }
  .tile {
    width: 170px; padding: 18px 8px 14px; border-radius: 22px; background: var(--card2); border: 1.5px solid rgba(214, 175, 107, .35);
    text-align: center; font-size: 25px; color: var(--muted);
  }
  .tile svg { width: 56px; height: 56px; display: block; margin: 0 auto 8px; }
  .big {
    width: 330px; padding: 24px 12px 18px; border-radius: 28px; background: linear-gradient(160deg, #2a4a38, #1B3325);
    border: 3px solid var(--gold); text-align: center; box-shadow: 0 0 60px rgba(214, 175, 107, .22);
  }
  .big .ic { display: flex; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .big svg { width: 60px; height: 60px; }
  .big b { display: block; font-size: 38px; color: var(--cream); font-weight: 700; }
  .big small { display: block; white-space: nowrap; font-size: 22px; color: var(--gold); margin-top: 4px; }
  .ch { width: 190px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .arrow { margin: 28px 0 0; }
  .count { font-size: 30px; color: var(--gold); font-weight: 500; margin-top: 18px; }
  .count bdi { font-weight: 700; font-size: 40px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="home"><path d="M8 30L32 8l24 22" /><path d="M14 27v26h36V27" /><path d="M27 53V37h10v16" /></g>
  <g id="moon"><path d="M42 10a22 22 0 1 0 14 34A18 18 0 0 1 42 10z"/><path d="M50 12l1.6 3.4 3.6.5-2.6 2.6.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.6 3.6-.5z"/></g>
  <g id="gear"><circle cx="32" cy="32" r="8"/><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M49 15l-6 6M21 43l-6 6"/></g>
  <g id="tv"><rect x="8" y="12" width="48" height="32" rx="5"/><path d="M22 54h20M32 44v10"/><path d="M26 22l14 6-14 6z"/></g>
</defs></svg>
<div class="stage" id="root">
  <div class="col">
    <div class="pillrow"><span class="pill"><svg class="star" viewBox="0 0 100 100"><use href="#st" fill="#D1AB68"/></svg><span dir="ltr">ChouiTV Installer · 1.6</span></span></div>
    <h1 id="t"></h1>
    <p class="sub" id="s"></p>
    <div class="rule"></div>
    <div id="cards"></div>
  </div>
  <div class="panel">
    <span class="tag" id="tag"></span>
    <div class="lbl" id="l1"></div>
    <div class="row">
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#B9B39F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#home"/></svg><span id="a1"></span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#B9B39F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#moon"/></svg><span id="a2"></span></div>
      <div class="tile"><svg viewBox="0 0 64 64" fill="none" stroke="#B9B39F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#tv"/></svg><span id="a3"></span></div>
    </div>
    <svg class="arrow" width="70" height="120" viewBox="0 0 70 120" fill="none" stroke="#D1AB68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 8v92M14 80l21 24 21-24"/></svg>
    <div class="lbl" id="l2"></div>
    <div class="row">
      <div class="big">
        <div class="ic" fill="none">
          <svg viewBox="0 0 64 64" fill="none" stroke="#D1AB68" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><use href="#home"/></svg>
          <svg viewBox="0 0 64 64" fill="none" stroke="#D1AB68" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><use href="#moon"/></svg>
          <svg viewBox="0 0 64 64" fill="none" stroke="#D1AB68" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><use href="#gear"/></svg>
        </div>
        <b><bdi>ChouiTV 4.0</bdi></b><small id="bs"></small>
      </div>
      <div class="tile ch"><svg viewBox="0 0 64 64" fill="none" stroke="#B9B39F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#tv"/></svg><span id="a4"></span></div>
    </div>
    <div class="count" id="cnt"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
const L = {
  fr: { dir: "ltr", lang: "fr",
    t: "Nouveau dans la <bdi>1.6</bdi>", s: "ChouiTV 4.0 tient en une seule appli",
    cards: [["Une seule appli", "ChouiTV 4.0 + Chaînes : 2 fichiers au lieu de 3"],
            ["Vos réglages suivent", "Repris tout seuls depuis l'ancien écran de veille"],
            ["Rien n'est retiré sans votre « oui »", "Si une étape échoue, l'ancienne appli reste"]],
    tag: "Schéma, pas une capture", l1: "<em><bdi>3.x</bdi></em> trois applis", l2: "<em><bdi>4.0</bdi></em> une appli + Chaînes",
    a1: "Accueil", a2: "Veille et réglages", a3: "Chaînes", a4: "Chaînes", bs: "accueil · veille · réglages",
    cnt: "<bdi>3</bdi> fichiers → <bdi>2</bdi> fichiers" },
  en: { dir: "ltr", lang: "en",
    t: "What's new in <bdi>1.6</bdi>", s: "ChouiTV 4.0 is a single app",
    cards: [["One app", "ChouiTV 4.0 + Channels: 2 files instead of 3"],
            ["Your settings follow", "Carried over by themselves from the old screensaver"],
            ["Nothing removed without your “yes”", "If any step fails, the old app stays"]],
    tag: "Diagram, not a screenshot", l1: "<em><bdi>3.x</bdi></em> three apps", l2: "<em><bdi>4.0</bdi></em> one app + Channels",
    a1: "Home", a2: "Screensaver and settings", a3: "Channels", a4: "Channels", bs: "home · screensaver · settings",
    cnt: "<bdi>3</bdi> files → <bdi>2</bdi> files" },
  ar: { dir: "rtl", lang: "ar",
    t: "الجديد في الإصدار <bdi>1.6</bdi>", s: "<bdi>ChouiTV 4.0</bdi> صار تطبيقًا واحدًا",
    cards: [["تطبيق واحد فقط", "<bdi>ChouiTV 4.0</bdi> مع القنوات: ملفّان بدل ثلاثة"],
            ["إعداداتك تنتقل معك", "تُنقل تلقائيًا من شاشة التوقف القديمة"],
            ["لا إزالة دون «نعم» منك", "وإن تعذّرت أي خطوة بقي التطبيق القديم"]],
    tag: "رسم توضيحي وليس لقطة شاشة", l1: "<em><bdi>3.x</bdi></em> ثلاثة تطبيقات", l2: "<em><bdi>4.0</bdi></em> تطبيق واحد + القنوات",
    a1: "الرئيسية", a2: "التوقف والإعدادات", a3: "القنوات", a4: "القنوات", bs: "الرئيسية · التوقف · الإعدادات",
    cnt: "<bdi>3</bdi> ملفات ← ملفّان" }
};
const c = pageLang(L);
document.getElementById("t").innerHTML = c.t; document.getElementById("s").innerHTML = c.s;
document.getElementById("cards").innerHTML = c.cards.map(([h, p]) => `<div class="card">${CHECK_BADGE}<div><b>${h}</b><span>${p}</span></div></div>`).join("");
for (const k of ["tag", "l1", "l2", "a1", "a2", "a3", "a4", "bs", "cnt"]) document.getElementById(k).innerHTML = c[k];
</script>
</body></html>
