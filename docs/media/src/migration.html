<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { height: 780px; }
  .stage { height: 780px; padding: 84px 70px 0; }
  .head { text-align: center; }
  h1 { font-size: 66px; }
  .sub { font-size: 32px; color: var(--muted); margin: 10px 0 0; }
  .steps { display: flex; align-items: stretch; justify-content: center; margin-top: 44px; gap: 0; }
  .step {
    width: 300px; padding: 0 20px 22px; border-radius: 28px; text-align: center; position: relative;
    background: linear-gradient(160deg, rgba(27, 51, 37, .96), rgba(14, 33, 23, .96)); border: 2px solid rgba(214, 175, 107, .4);
  }
  .step .badge { width: 74px; height: 74px; margin: -37px auto 6px; position: relative; display: block; }
  .step .badge svg { width: 74px; height: 74px; display: block; }
  .step .badge i {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal;
    font-size: 34px; font-weight: 700; color: #0b1d13;
  }
  .step .ic { width: 58px; height: 58px; margin: 6px auto 8px; display: block; }
  .step b { display: block; font-size: 32px; color: var(--gold); font-weight: 700; line-height: 1.15; margin-bottom: 8px; }
  .step span { display: block; font-size: 25px; color: var(--cream); line-height: 1.32; }
  .step.ask { border: 3px solid var(--gold); box-shadow: 0 0 56px rgba(214, 175, 107, .25); background: linear-gradient(160deg, #2c4c39, #1B3325); }
  .yes {
    display: inline-block; margin-top: 14px; padding: 6px 30px; border-radius: 999px; background: linear-gradient(180deg, #E5C887, #C9A15B);
    color: #0b1d13; font-size: 28px; font-weight: 700;
  }
  .join { width: 38px; flex: none; display: flex; align-items: center; justify-content: center; }
  [dir=rtl] .join svg { transform: scaleX(-1); }
  .note {
    margin: 34px auto 0; width: 1500px; display: flex; align-items: center; gap: 24px; padding: 20px 34px; border-radius: 26px;
    border: 2px solid rgba(93, 181, 138, .65); background: rgba(31, 78, 52, .35); font-size: 29px; line-height: 1.3;
  }
  .note svg { width: 52px; height: 52px; flex: none; }
  .note b { color: var(--mint); font-weight: 700; }
</style></head>
<body>
<div class="stage" id="root">
  <div class="head"><h1 id="t"></h1><p class="sub" id="s"></p></div>
  <div class="steps" id="steps"></div>
  <div class="note" id="note"></div>
</div>
<script src="common.js"></script>
<script>
const ICON = {
  keep: '<path d="M10 14h34l10 10v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z"/><path d="M18 14v14h22V14M18 56V40h28v16"/>',
  install: '<path d="M32 8v32M18 28l14 14 14-14"/><path d="M10 46v8h44v-8"/>',
  hand: '<path d="M8 22h38M36 12l12 10-12 10"/><path d="M56 42H18M28 32L16 42l12 10"/>',
  moon: '<path d="M42 10a22 22 0 1 0 14 34A18 18 0 0 1 42 10z"/><path d="M50 12l1.6 3.4 3.6.5-2.6 2.6.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.6 3.6-.5z"/>',
  bin: '<path d="M12 16h40M24 16v-6h16v6M16 16l3 40h26l3-40M28 26v22M36 26v22"/>'
};
const L = {
  fr: { dir: "ltr",
    t: "De ChouiTV <bdi>3.x</bdi> à <bdi>4.0</bdi>, pas à pas", s: "Ce que fait l'installateur sur une télé qui a encore l'ancien écran de veille",
    steps: [["keep", "Garder les réglages", "Lus dans l'ancien écran de veille, mis de côté sur le téléphone"],
            ["install", "Installer 4.0", "Une seule appli : accueil, veille et réglages"],
            ["hand", "Transmettre", "ChouiTV 4.0 reprend la ville, la prière, les radios…"],
            ["moon", "Nouvel écran de veille", "ChouiTV 4.0 devient l'écran de veille"],
            ["bin", "Retirer l'ancienne", "Seulement si vous répondez", "« oui »"]],
    note: "<div><b>Si une étape échoue,</b> l'ancienne appli reste en place avec ses réglages, leur seule copie.</div>" },
  en: { dir: "ltr",
    t: "From ChouiTV <bdi>3.x</bdi> to <bdi>4.0</bdi>, step by step", s: "What the installer does on a TV that still has the old screensaver",
    steps: [["keep", "Keep the settings", "Read from the old screensaver, set aside on the phone"],
            ["install", "Install 4.0", "One app: home, screensaver and settings"],
            ["hand", "Hand over", "ChouiTV 4.0 takes the city, prayer method, radios…"],
            ["moon", "New screensaver", "ChouiTV 4.0 becomes the TV's screensaver"],
            ["bin", "Remove the old one", "Only if you answer", "“Yes”"]],
    note: "<div><b>If any step fails,</b> the old app stays in place with its settings, their only copy.</div>" },
  ar: { dir: "rtl",
    t: "من <bdi>ChouiTV 3.x</bdi> إلى <bdi>4.0</bdi> خطوة بخطوة", s: "ما يفعله المثبِّت على تلفزيون ما زالت فيه شاشة التوقف القديمة",
    steps: [["keep", "احتفظ بالإعدادات", "تُقرأ من شاشة التوقف القديمة وتُحفظ على الهاتف"],
            ["install", "ثبّت 4.0", "تطبيق واحد: الرئيسية وشاشة التوقف والإعدادات"],
            ["hand", "سلّم الإعدادات", "يأخذ <bdi>ChouiTV 4.0</bdi> المدينة وطريقة الصلاة والإذاعات…"],
            ["moon", "شاشة توقف جديدة", "يصبح <bdi>ChouiTV 4.0</bdi> شاشة توقف التلفزيون"],
            ["bin", "أزل القديم", "فقط إن أجبتَ", "«نعم»"]],
    note: "<div><b>إن تعذّرت أي خطوة</b> بقي التطبيق القديم بإعداداته: فهي نسختها الوحيدة.</div>" }
};
const c = pageLang(L);
document.getElementById("t").innerHTML = c.t; document.getElementById("s").innerHTML = c.s;
const chev = '<div class="join"><svg width="30" height="44" viewBox="0 0 30 44" fill="none" stroke="#D1AB68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l16 16L8 38"/></svg></div>';
document.getElementById("steps").innerHTML = c.steps.map(([ic, h, p, yes], i) =>
  `<div class="step${yes ? " ask" : ""}"><div class="badge"><svg viewBox="0 0 100 100"><use href="#st" fill="#D1AB68"/></svg><i>${i + 1}</i></div>` +
  `<svg class="ic" viewBox="0 0 64 64" fill="none" stroke="#D1AB68" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${ICON[ic]}</svg>` +
  `<b>${h}</b><span>${p}</span>${yes ? `<div class="yes">${yes}</div>` : ""}</div>`
).join(chev);
document.getElementById("note").innerHTML =
  '<svg viewBox="0 0 64 64" fill="none" stroke="#5DB58A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6l20 8v16c0 14-9 22-20 28C21 52 12 44 12 30V14z"/><path d="M22 32l8 8 14-16"/></svg>' + c.note;
</script>
</body></html>
